<!DOCTYPE html>
<!-- Saved by ChangeWriter to <history folder>/<run>/Report.html on Finalize. Self-contained: no links back to Kai. -->
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title th:text="'Kai report ' + ${run}">Kai report</title>
    <style>
        :root { color-scheme: light; --ink: #17252b; --muted: #5f6f76; --line: #dde4e7; --paper: #f6f8f9;
                --teal: #1f5c6b; --error: #b42318; --manual: #b45309; --del: #fdecea; --add: #e6f4ea; }
        body { margin: 0 auto; max-width: 980px; padding: 28px 24px 60px; background: var(--paper); color: var(--ink);
               font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
        h1 { font: 600 28px/1.2 Charter, "Iowan Old Style", Georgia, serif; margin: 0 0 4px; }
        h2 { font: 500 20px/1.3 Charter, "Iowan Old Style", Georgia, serif; margin: 32px 0 10px; }
        .meta { color: var(--muted); font-size: 13px; margin: 0 0 16px; }
        .request { background: #fff; border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; white-space: pre-wrap; }
        .outcome { margin: 16px 0 0; padding: 10px 14px; border-radius: 8px; background: #fff; border: 1px solid var(--line);
                   white-space: pre-wrap; font-weight: 500; }
        section.file { background: #fff; border: 1px solid var(--line); border-radius: 10px; padding: 14px; margin: 0 0 14px; }
        .file h3 { margin: 0 0 4px; font: 600 14px ui-monospace, SFMono-Regular, Menlo, monospace; }
        .file p { margin: 0 0 8px; font-size: 13px; color: var(--muted); }
        .file p.warn { color: var(--manual); }
        code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, monospace; }
        .diff { border: 1px solid var(--line); border-radius: 6px; font: 12.5px/1.45 ui-monospace, SFMono-Regular, Menlo, monospace; }
        .diff > div { white-space: pre-wrap; padding: 0 10px 0 26px; min-height: 1.45em; text-indent: -16px; }
        .diff .del { background: var(--del); }
        .diff .add { background: var(--add); }
        .diff .del::before { content: "− "; color: var(--error); }
        .diff .add::before { content: "+ "; color: #1a7f37; }
        .diff .same::before { content: "  "; }
        .diff .gap { color: var(--muted); font-style: italic; background: var(--paper); text-indent: 0; padding-left: 10px; }
        table { width: 100%; border-collapse: collapse; background: #fff; border: 1px solid var(--line); border-radius: 10px; }
        td, th { text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--line); font-size: 13px; vertical-align: top; }
        th { color: var(--muted); font-weight: 500; }
            /* Standalone report actions. Hidden when printing or rendering the PDF. */
        .report-toolbar { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between;
            align-items: center; background: #fff; border: 1px solid var(--line); padding: 10px 12px;
            border-radius: 8px; margin-bottom: 24px; }
        .report-toolbar .report-actions { display: flex; flex-wrap: wrap; gap: 8px; }
        .report-toolbar button, .report-toolbar a { font: inherit; font-size: 13px; border-radius: 7px;
            padding: 8px 12px; cursor: pointer; border: 1px solid #1f5c6b; color: #1f5c6b;
            text-decoration: none; background: #fff; font-weight: 600; }
        .report-toolbar a.download-pdf { color: #fff; background: #1f5c6b; }
        .report-toolbar button:hover, .report-toolbar a:hover { filter: brightness(.94); }
        .report-toolbar :focus-visible, .kai-back-dialog :focus-visible { outline: 2px solid #1f5c6b; outline-offset: 2px; }
        .kai-back-dialog { border: 1px solid var(--line); border-radius: 12px; max-width: 440px;
            width: calc(100vw - 32px); padding: 24px; background: #fff; color: var(--ink);
            box-shadow: 0 18px 45px rgba(23,37,43,.18); }
        .kai-back-dialog::backdrop { background: rgba(23,37,43,.45); }
        .kai-back-dialog h2 { margin: 0 0 12px; font: 600 21px/1.3 system-ui,sans-serif; }
        .kai-back-dialog p { color: var(--muted); font-size: 14px; margin: 0 0 16px; }
        .kai-back-dialog .choices { display: flex; gap: 9px; flex-wrap: wrap; }
        .kai-back-dialog button { font: inherit; padding: 9px 12px; background: #fff; color: #1f5c6b;
            cursor: pointer; border-radius: 6px; border: 1px solid #1f5c6b; }
        .kai-back-dialog button.reset { background: #1f5c6b; color: #fff; }
        .kai-back-dialog form { display: inline; }
        @media print {
            .report-toolbar, .kai-back-dialog { display: none !important; }
            body { background: #fff; max-width: none; }
            section.file { break-inside: avoid; }
        }
        .report-toolbar[hidden] { display: none !important; }
</style>
</head>
<body><div class="report-toolbar" id="kai-report-toolbar" hidden>
    <strong>Report actions</strong>
    <div class="report-actions">
        <button type="button" id="kai-report-back">← Back to chat</button>
        <a class="download-pdf" id="kai-report-pdf" href="#">Download PDF</a>
    </div>
</div>
<dialog class="kai-back-dialog" id="kai-back-dialog" aria-labelledby="kai-back-title">
    <h2 id="kai-back-title">Return to KAI?</h2>
    <p>Keep your conversation, or reset it for a fresh start. Finalized reports and original-file backups stay saved.</p>
    <div class="choices">
        <form action="/new" method="post" id="kai-report-reset-form">
            <button type="submit" class="reset">Reset and Go Back</button>
        </form>
        <button type="button" id="kai-keep-chat">Just Go Back</button>
        <button type="button" id="kai-cancel-back">Cancel</button>
    </div>
</dialog>

<h1>Kai change report</h1>
<p class="meta" th:text="${run} + ': ' + ${rows.size()} + (${rows.size() == 1} ? ' file' : ' files') + ' selected for writing. The originals are in the Original files folder next to this report.'"></p>
<p class="meta" th:if="${report.source}" th:text="'Checked against the updated file ' + ${report.source.name()} + ' (not scanned)'"></p>
<div class="request" th:text="${report.instruction}"></div>
<p class="outcome" th:text="${outcome}"></p>

<h2>Changed files</h2>
<section class="file" th:each="r : ${rows}" th:with="f=${r.finding}, p=${r.finding.proposal}">
    <h3 th:text="${f.target.entry} + '/' + ${f.file}"></h3>
    <p th:text="'Why: ' + ${f.reason}"></p>
    <p th:classappend="${p.reviewOk() != null and p.reviewOk()} ? '' : 'warn'"
       th:text="(${p.reviewOk() == null} ? 'Not reviewed. ' : (${p.reviewOk()} ? 'Reviewer: looks right. ' : 'Reviewer: please check. ')) + ${p.review()} + (${p.edited()} ? ' (Edited by the user after the review.)' : '')"></p>
    <p>Original kept in <code th:text="${r.backup}"></code></p>
    <div class="diff"><div th:each="l : ${p.diff()}" th:class="${l.kind}" th:text="${l.text}"></div></div>
</section>

<th:block th:unless="${#lists.isEmpty(notWritten)}">
    <h2>Affected, but not changed by Kai</h2>
    <table>
        <tr><th>File</th><th>Why not</th></tr>
        <tr th:each="f : ${notWritten}">
            <td><code th:text="${f.target.entry} + '/' + ${f.file}"></code></td>
            <td th:text="${f.manual()} ? 'Update by hand (Word, PowerPoint or PDF)' : (${f.proposal == null or !f.proposal.ready()} ? 'Could not apply: update by hand' : (${!f.proposal.include()} ? 'Unticked in the review' : 'No changes left after review'))"></td>
        </tr>
    </table>
</th:block>
<script>
(() => {
    const toolbar = document.getElementById('kai-report-toolbar');
    const pdfLink = document.getElementById('kai-report-pdf');
    const dialog = document.getElementById('kai-back-dialog');
    const online = /^https?:$/.test(window.location.protocol) &&
        window.location.pathname.startsWith('/report/');

    toolbar.hidden = false;
    if (online) {
        pdfLink.href = window.location.pathname.replace(/\/$/, '') + '/pdf';
    } else {
        // The archived Report.html is self-contained and usable with KAI shut down.
        pdfLink.removeAttribute('href');
        pdfLink.textContent = 'Save as PDF (print)';
        pdfLink.setAttribute('role', 'button');
        pdfLink.tabIndex = 0;
        pdfLink.addEventListener('click', () => window.print());
        pdfLink.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); window.print(); } });
    }

    function backToChat() {
        if (!online) {
            window.alert('Open this report through the running KAI application to return to chat.');
            return;
        }
        dialog.showModal();
    }
    document.getElementById('kai-report-back').addEventListener('click', backToChat);
    document.getElementById('kai-cancel-back').addEventListener('click', () => dialog.close());
    document.getElementById('kai-keep-chat').addEventListener('click', () => {
        dialog.close();
        window.location.assign('/');
    });
    document.getElementById('kai-report-reset-form').addEventListener('submit', event => {
        if (!online) event.preventDefault();
    });
})();
</script>

</body>
</html>
