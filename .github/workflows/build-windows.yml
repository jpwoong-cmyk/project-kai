name: Build KAI Windows EXE

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - name: Check out KAI
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          java-package: jdk+jmods
          cache: maven

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: false

      - name: Build application JAR
        shell: pwsh
        run: |
          .\mvnw.cmd -B clean package
          if ($LASTEXITCODE -ne 0) { throw 'Maven build failed' }

      - name: Package bundled Java runtime
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force staging, dist | Out-Null
          & "$env:JAVA_HOME\bin\jlink.exe" --module-path "$env:JAVA_HOME\jmods" --add-modules ALL-MODULE-PATH --strip-debug --no-man-pages --no-header-files --output staging/jre
          if ($LASTEXITCODE -ne 0) { throw 'jlink failed' }

          $jar = Get-ChildItem target -Filter '*.jar' |
            Where-Object { $_.Name -notlike '*.original' -and $_.Name -notlike '*-sources.jar' } |
            Select-Object -First 1
          if (-not $jar) { throw 'No application JAR found' }
          Copy-Item $jar.FullName staging/kai.jar
          tar -czf packaging/launcher/payload.tar.gz -C staging jre kai.jar
          if ($LASTEXITCODE -ne 0) { throw 'Payload creation failed' }

      - name: Build kai.exe
        shell: pwsh
        run: |
          Push-Location packaging/launcher
          try {
            $env:GOOS = 'windows'
            $env:GOARCH = 'amd64'
            $env:CGO_ENABLED = '0'
            go build -trimpath -ldflags='-s -w' -o "$env:GITHUB_WORKSPACE/dist/kai.exe" .
            if ($LASTEXITCODE -ne 0) { throw 'Go build failed' }
          } finally {
            Pop-Location
          }

      - name: Create clean user settings and ZIP
        shell: pwsh
        run: |
          @'
          kai.scan.local=
          kai.backup-dir=./kai-history
          kai.scan.parallel=4
          spring.ai.openai.api-key=
          spring.ai.openai.base-url=
          spring.ai.openai.chat.model=
          server.address=127.0.0.1
          '@ | Set-Content dist/kai.properties -Encoding ascii
          Copy-Item packaging/README.md dist/README.md
          Compress-Archive -Path dist/kai.exe,dist/kai.properties,dist/README.md -DestinationPath KAI-Windows.zip

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@v4
        with:
          name: KAI-Windows-EXE
          path: KAI-Windows.zip
          retention-days: 30
